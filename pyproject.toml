[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdiff"
version = "0.1.0"
description = "Deterministic triage of an AI agent's changes — see what it actually touched before you merge."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "stillworks contributors" }]
keywords = [
  "git", "diff", "code-review", "ai-agents", "coding-agents",
  "security", "secrets", "dependencies", "ci-cd", "deterministic",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
agentdiff = "agentdiff.cli:main"

[project.urls]
Homepage = "https://github.com/iselur/agentdiff"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentdiff*"]
